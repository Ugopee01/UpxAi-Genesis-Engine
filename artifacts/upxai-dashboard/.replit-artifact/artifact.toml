kind = "web"
previewPath = "/dev-preview"
title = "UPXAI Genesis Engine"
version = "1.0.0"
id = "artifacts/upxai-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/dev-preview" ]
localPort = 3000

[services.development]
run = "pnpm --filter @workspace/upxai-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/upxai-dashboard", "run", "build" ]
publicDir = "artifacts/upxai-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "3000"
BASE_PATH = "/dev-preview"
