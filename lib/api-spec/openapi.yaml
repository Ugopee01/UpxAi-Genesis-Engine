openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: UPXAI Genesis Engine API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: trading
    description: Trading signal and execution operations
  - name: exchanges
    description: Exchange connection management
paths:
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with username and password
      description: Establishes a session cookie on success
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out and clear the session cookie
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResult"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the currently signed-in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /signal:
    get:
      operationId: getSignal
      tags: [trading]
      summary: Get trading signal
      description: Returns BUY/SELL/HOLD signal for a symbol based on RSI analysis
      parameters:
        - name: symbol
          in: query
          required: false
          schema:
            type: string
            default: BTCUSDT
      responses:
        "200":
          description: Signal result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalResponse"
        "500":
          description: Error fetching signal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /trade:
    post:
      operationId: executeTrade
      tags: [trading]
      summary: Execute a trade (simulated by default, live when armed and confirmed)
      description: Executes a trade based on the current signal. Defaults to dry-run; routes a real spot order to the connected exchange when liveMode and confirmLive are both true.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeRequest"
      responses:
        "200":
          description: Trade execution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeResponse"
        "500":
          description: Error executing trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /market-data:
    get:
      operationId: getMarketData
      tags: [trading]
      summary: Get live market data
      description: Returns current price and 24h stats for a symbol
      parameters:
        - name: symbol
          in: query
          required: false
          schema:
            type: string
            default: BTCUSDT
      responses:
        "200":
          description: Market data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketDataResponse"
        "500":
          description: Error fetching market data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /signals/history:
    get:
      operationId: getSignalHistory
      tags: [trading]
      summary: Get signal history
      description: Returns the last N signals generated
      responses:
        "200":
          description: Signal history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalHistoryResponse"
  /exchanges:
    get:
      operationId: listExchanges
      tags: [exchanges]
      summary: List supported exchanges and their connection status
      responses:
        "200":
          description: Exchange list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeListResponse"
  /exchanges/{exchange}/connect:
    post:
      operationId: connectExchange
      tags: [exchanges]
      summary: Save API credentials for an exchange
      parameters:
        - name: exchange
          in: path
          required: true
          schema:
            type: string
            enum: [binance, bybit]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeCredentialsRequest"
      responses:
        "200":
          description: Connection saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeStatus"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /exchanges/{exchange}/disconnect:
    post:
      operationId: disconnectExchange
      tags: [exchanges]
      summary: Remove saved credentials for an exchange
      parameters:
        - name: exchange
          in: path
          required: true
          schema:
            type: string
            enum: [binance, bybit]
      responses:
        "200":
          description: Connection removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeStatus"
  /exchanges/{exchange}/test:
    post:
      operationId: testExchange
      tags: [exchanges]
      summary: Test the connection to an exchange using stored credentials
      parameters:
        - name: exchange
          in: path
          required: true
          schema:
            type: string
            enum: [binance, bybit]
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeTestResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SignalResponse:
      type: object
      properties:
        signal:
          type: string
          enum: [BUY, SELL, HOLD]
        symbol:
          type: string
        rsi:
          type: number
        price:
          type: number
        timestamp:
          type: string
      required:
        - signal
        - symbol
        - rsi
        - price
        - timestamp
    TradeRequest:
      type: object
      properties:
        symbol:
          type: string
          default: BTCUSDT
        liveMode:
          type: boolean
          default: false
        confirmLive:
          type: boolean
          default: false
          description: Must be true when liveMode is true to actually place a real order
        side:
          type: string
          enum: [BUY, SELL]
          description: Override the signal direction; defaults to the current signal
        quantityUsdt:
          type: number
          description: Order notional in USDT (quote currency). Required when liveMode is true.
        targetExchange:
          type: string
          enum: [binance, bybit]
          description: Which connected exchange to route the order to. Defaults to first available.
    TradeResponse:
      type: object
      properties:
        executed:
          type: object
          properties:
            signal:
              type: string
              enum: [BUY, SELL, HOLD]
            symbol:
              type: string
            rsi:
              type: number
            price:
              type: number
            timestamp:
              type: string
          required:
            - signal
            - symbol
            - rsi
            - price
            - timestamp
        simulated:
          type: boolean
        liveMode:
          type: boolean
        mode:
          type: string
          enum: [LIVE, SIMULATED]
        targetExchange:
          type: string
          enum: [binance, bybit]
        orderId:
          type: string
        executedQty:
          type: number
        executedQuoteQty:
          type: number
        status:
          type: string
          enum: [FILLED, ACCEPTED, FAILED, SIMULATED]
        error:
          type: string
      required:
        - executed
        - simulated
        - liveMode
        - mode
        - status
    MarketDataResponse:
      type: object
      properties:
        symbol:
          type: string
        price:
          type: number
        priceChange24h:
          type: number
        priceChangePercent24h:
          type: number
        high24h:
          type: number
        low24h:
          type: number
        volume24h:
          type: number
        timestamp:
          type: string
      required:
        - symbol
        - price
        - priceChange24h
        - priceChangePercent24h
        - high24h
        - low24h
        - volume24h
        - timestamp
    SignalHistoryItem:
      type: object
      properties:
        signal:
          type: string
          enum: [BUY, SELL, HOLD]
        symbol:
          type: string
        rsi:
          type: number
        price:
          type: number
        timestamp:
          type: string
        mode:
          type: string
          enum: [LIVE, SIMULATED]
        status:
          type: string
          enum: [FILLED, ACCEPTED, FAILED, SIMULATED]
        targetExchange:
          type: string
          enum: [binance, bybit]
        orderId:
          type: string
        executedQty:
          type: number
        executedQuoteQty:
          type: number
        error:
          type: string
      required:
        - signal
        - symbol
        - rsi
        - price
        - timestamp
    SignalHistoryResponse:
      type: object
      properties:
        history:
          type: array
          items:
            $ref: "#/components/schemas/SignalHistoryItem"
      required:
        - history
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    ExchangeStatus:
      type: object
      properties:
        exchange:
          type: string
          enum: [binance, bybit]
        name:
          type: string
        configured:
          type: boolean
        apiKeyMasked:
          type: string
        lastTestedAt:
          type: string
        lastTestStatus:
          type: string
          enum: [ok, error, untested]
        lastTestMessage:
          type: string
      required:
        - exchange
        - name
        - configured
        - lastTestStatus
    ExchangeListResponse:
      type: object
      properties:
        exchanges:
          type: array
          items:
            $ref: "#/components/schemas/ExchangeStatus"
        connectedCount:
          type: integer
      required:
        - exchanges
        - connectedCount
    ExchangeCredentialsRequest:
      type: object
      properties:
        apiKey:
          type: string
        apiSecret:
          type: string
      required:
        - apiKey
        - apiSecret
    ExchangeTestResponse:
      type: object
      properties:
        exchange:
          type: string
          enum: [binance, bybit]
        success:
          type: boolean
        message:
          type: string
        testedAt:
          type: string
      required:
        - exchange
        - success
        - message
        - testedAt
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
    AuthUser:
      type: object
      properties:
        username:
          type: string
      required:
        - username
    AuthSession:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
      required:
        - user
    LogoutResult:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
